[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hello-mlsys-lab"
version = "0.1.0"
description = "CLI teaching workflow and replaceable mock backends for hello-mlsys"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]  # httpx: Starlette's test client for the web API tests.
# Local web page: one Claude Code agent per task. 0.2.177 bundles CLI 2.1.317, the pinned version.
web = ["claude-agent-sdk==0.2.177", "starlette>=0.37,<1", "uvicorn>=0.30,<1"]

[project.scripts]
mlab = "mlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
