name: CLI contracts and fixture workflows

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,web]"
      - run: python -m pytest -q
      - run: python -m mlab demo --task 9.2 --out workspaces/ci-fixture
