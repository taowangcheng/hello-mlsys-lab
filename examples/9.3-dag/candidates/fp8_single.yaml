schema: mlab.v1
id: fp8_single
infra: w7900d_x4
rationale: 32B FP8 on one GPU, which frees a GPU for one more 7B replica.
strategy:
  deployments:
    - model: llm-32b
      weight_precision: FP8
      context_tokens: 32768
      devices: [gpu0]
    - model: llm-7b
      weight_precision: FP8
      context_tokens: 16384
      replicas: 3
      devices: [gpu1, gpu2, gpu3]
  serving:
    max_concurrency: 16
    continuous_batching: true
  scheduling:
    priority: critical_path
